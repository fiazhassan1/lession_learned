name: e2e

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Live URL to hit instead of the local fixture (optional)"
        required: false
        type: string

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-and-e2e:
    name: Playwright smoke + e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: ${{ inputs.base_url || vars.BASE_URL || 'http://127.0.0.1:4173' }}
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: API unit tests
        run: npm run api:test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local fixture when no live BASE_URL
        if: ${{ env.BASE_URL == 'http://127.0.0.1:4173' }}
        run: |
          npx --yes serve site -l 4173 --no-port-switching &
          for i in $(seq 1 30); do
            if curl -fsS "$BASE_URL" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "site did not start on 4173"
          exit 1

      - name: Start optional API (health check is required in CI)
        run: |
          node apps/api/src/server.js > api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "API did not start on 3001"
          cat api.log
          exit 1

      - name: Run smoke
        run: npm run test:smoke

      - name: Run e2e
        env:
          API_REQUIRED: "1"
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload traces on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
